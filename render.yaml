services:
  - type: web
    name: prospecthunter-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @prospecthunter/database db:generate && pnpm --filter api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
